openapi: 3.0.3
info:
  title: 'Ready Booking API'
  description: 'REST API for the Ready Booking platform — covering property listings, hotel bookings, technician marketplace, reviews, notifications, and admin operations.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: General
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token via <code>POST /api/v1/auth/login</code>. Pass it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/config/bootstrap:
    get:
      summary: 'GET /api/v1/config/bootstrap'
      operationId: gETapiv1configbootstrap
      description: "Single call that gives clients everything they need to configure themselves:\nsite info, languages, currencies, active payment gateways (no secrets),\nfeature toggles, limits, map provider public key, property types,\nand technician categories.\n\nResponse is cached for 5 minutes."
      parameters: []
      responses: {  }
      tags:
        - General
  '/api/v1/translations/{locale}':
    get:
      summary: 'GET /api/v1/translations/{locale}'
      operationId: gETapiv1translationslocale
      description: "Return all translation strings for the given locale, grouped by translation group.\nResponse: { \"auth\": { \"login\": \"Login\" }, \"common\": { \"save\": \"Save\" }, ... }"
      parameters: []
      responses: {  }
      tags:
        - General
    parameters:
      -
        in: path
        name: locale
        description: ''
        example: sr_BA
        required: true
        schema:
          type: string
  /api/v1/custom-fields:
    get:
      summary: 'GET /api/v1/custom-fields?property_type=rent'
      operationId: gETapiv1customFieldspropertyTyperent
      description: "Return active custom fields for a given property type.\nUsed by listing forms to know which extra fields to render."
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                property_type:
                  type: string
                  description: ''
                  example: architecto
              required:
                - property_type
  /api/v1/property-types:
    get:
      summary: 'GET /api/v1/property-types'
      operationId: gETapiv1propertyTypes
      description: 'Return the canonical list of property types the platform supports.'
      parameters: []
      responses: {  }
      tags:
        - General
  /api/v1/amenities:
    get:
      summary: 'GET /api/v1/amenities'
      operationId: gETapiv1amenities
      description: "Return the list of amenity options clients can attach to a listing\nvia the utility_flags JSON field. Configurable via admin settings\n(property_amenity_options), with sensible defaults."
      parameters: []
      responses: {  }
      tags:
        - General
  /api/v1/auth/register/start:
    post:
      summary: 'POST /api/v1/auth/register/start'
      operationId: pOSTapiv1authregisterstart
      description: 'Send registration OTP to phone. Returns 409 if phone already registered.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: bngzmiyvdljnikhw
                name:
                  type: string
                  description: validation.max.
                  example: a
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: breitenberg.gilbert@example.com
                  nullable: true
              required:
                - phone
  /api/v1/auth/register/verify:
    post:
      summary: 'POST /api/v1/auth/register/verify'
      operationId: pOSTapiv1authregisterverify
      description: 'Verify OTP, create user, return Sanctum token.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: bngzmiyvdljnikhw
                otp:
                  type: string
                  description: validation.digits.
                  example: '569775'
                name:
                  type: string
                  description: validation.max.
                  example: 'n'
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: ashly64@example.com
                  nullable: true
                password:
                  type: string
                  description: validation.min.
                  example: pBNvYg
                  nullable: true
              required:
                - phone
                - otp
                - name
  /api/v1/auth/login:
    post:
      summary: 'POST /api/v1/auth/login'
      operationId: pOSTapiv1authlogin
      description: "Two flows:\n  1. Email + password → immediate token.\n  2. Phone only        → send OTP, return {otp_sent: true, otp: \"...\"}.\n  3. Phone + otp       → verify OTP, return token."
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: bngzmiyvdljnikhw
                otp:
                  type: string
                  description: validation.digits.
                  example: '569775'
                  nullable: true
              required:
                - phone
  /api/v1/auth/social:
    post:
      summary: 'POST /api/v1/auth/social'
      operationId: pOSTapiv1authsocial
      description: "Exchange a Google/Facebook token for a Sanctum token.\nCreates an account on first sign-in."
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  description: ''
                  example: google
                  enum:
                    - google
                    - facebook
                token:
                  type: string
                  description: validation.max.
                  example: b
              required:
                - provider
                - token
  /api/v1/auth/forgot:
    post:
      summary: 'POST /api/v1/auth/forgot'
      operationId: pOSTapiv1authforgot
      description: 'Send password reset via email (token link) or phone (OTP).'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: gbailey@example.net
              required:
                - email
  /api/v1/auth/reset:
    post:
      summary: 'POST /api/v1/auth/reset'
      operationId: pOSTapiv1authreset
      description: 'Reset password via email token or phone OTP.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'This field is required when <code>phone</code> is not present. validation.email validation.max.'
                  example: gbailey@example.net
                  nullable: true
                token:
                  type: string
                  description: 'This field is required when <code>phone</code> is not present.'
                  example: architecto
                  nullable: true
                phone:
                  type: string
                  description: 'This field is required when <code>email</code> is not present. Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: ngzmiyvdljnikhwa
                  nullable: true
                otp:
                  type: string
                  description: 'This field is required when <code>email</code> is not present. validation.digits.'
                  example: '569775'
                  nullable: true
                password:
                  type: string
                  description: validation.min.
                  example: ']|{+-0pBNvYg'
              required:
                - password
  /api/v1/register/start:
    post:
      summary: 'POST /api/v1/auth/register/start'
      operationId: pOSTapiv1authregisterstart
      description: 'Send registration OTP to phone. Returns 409 if phone already registered.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: bngzmiyvdljnikhw
                name:
                  type: string
                  description: validation.max.
                  example: a
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: breitenberg.gilbert@example.com
                  nullable: true
              required:
                - phone
  /api/v1/register/verify:
    post:
      summary: 'POST /api/v1/auth/register/verify'
      operationId: pOSTapiv1authregisterverify
      description: 'Verify OTP, create user, return Sanctum token.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must match the regex /^\+?[0-9]{7,20}$/. validation.max.'
                  example: bngzmiyvdljnikhw
                otp:
                  type: string
                  description: validation.digits.
                  example: '569775'
                name:
                  type: string
                  description: validation.max.
                  example: 'n'
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: ashly64@example.com
                  nullable: true
                password:
                  type: string
                  description: validation.min.
                  example: pBNvYg
                  nullable: true
              required:
                - phone
                - otp
                - name
  /api/v1/zones/countries:
    get:
      summary: 'GET /api/v1/zones/countries'
      operationId: gETapiv1zonescountries
      description: 'Shortcut for active top-level country zones. Cached for 1 day.'
      parameters: []
      responses: {  }
      tags:
        - General
  /api/v1/zones/resolve:
    get:
      summary: 'GET /api/v1/zones/resolve?lat=23.77&lng=90.36&type=area&radius=50'
      operationId: gETapiv1zonesresolvelat2377lng9036typearearadius50
      description: "Finds the nearest active zone to the supplied coordinate.\nUses a bounding-box pre-filter then Haversine ORDER BY for accuracy.\n\nQuery parameters:\n  lat    – required, decimal\n  lng    – required, decimal\n  type   – country|state|city|area (default: area)\n  radius – bounding-box search radius in km (default: 50)"
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  description: validation.between.
                  example: -89
                lng:
                  type: number
                  description: validation.between.
                  example: -179
                type:
                  type: string
                  description: ''
                  example: null
                radius:
                  type: number
                  description: 'validation.min validation.max.'
                  example: 7
              required:
                - lat
                - lng
  /api/v1/zones:
    get:
      summary: 'GET /api/v1/zones'
      operationId: gETapiv1zones
      description: "Query parameters:\n  parent_id   – filter to children of a zone\n  type        – country|state|city|area\n  search      – name substring match\n  active_only – 0|1, default 1\n  mode        – flat (default, paginated) | tree (nested, cached)\n  per_page    – default 50, max 200"
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                type:
                  type: string
                  description: ''
                  example: null
                search:
                  type: string
                  description: validation.max.
                  example: 'n'
                active_only:
                  type: boolean
                  description: ''
                  example: true
                mode:
                  type: string
                  description: ''
                  example: null
                per_page:
                  type: integer
                  description: 'validation.min validation.max.'
                  example: 7
  '/api/v1/zones/{id}':
    get:
      summary: 'GET /api/v1/zones/{zone}'
      operationId: gETapiv1zoneszone
      description: 'Single zone with its immediate children and parent breadcrumb.'
      parameters: []
      responses: {  }
      tags:
        - General
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the zone.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/zones/{zone_id}/areas':
    get:
      summary: 'GET /api/v1/zones/{zone}/areas'
      operationId: gETapiv1zoneszoneareas
      description: "All active area-type children under a given parent zone (city or state).\nCached per parent zone."
      parameters: []
      responses: {  }
      tags:
        - General
    parameters:
      -
        in: path
        name: zone_id
        description: 'The ID of the zone.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/listings:
    get:
      summary: 'GET /api/v1/listings'
      operationId: gETapiv1listings
      description: "Paginated listing search with filters, sorting, map-bounds support,\nand facet counts in meta."
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                include_children:
                  type: boolean
                  description: ''
                  example: true
                type:
                  type: string
                  description: ''
                  example: null
                status:
                  type: string
                  description: ''
                  example: null
                min_price:
                  type: number
                  description: validation.min.
                  example: 39
                max_price:
                  type: number
                  description: validation.min.
                  example: 84
                bedrooms:
                  type: integer
                  description: validation.min.
                  example: 12
                bathrooms:
                  type: integer
                  description: validation.min.
                  example: 77
                allowed_for:
                  type: string
                  description: ''
                  example: null
                furnished:
                  type: boolean
                  description: ''
                  example: true
                parking:
                  type: boolean
                  description: ''
                  example: true
                floor:
                  type: integer
                  description: ''
                  example: 16
                advance_months:
                  type: integer
                  description: validation.min.
                  example: 39
                featured:
                  type: boolean
                  description: ''
                  example: true
                verified:
                  type: boolean
                  description: ''
                  example: false
                keyword:
                  type: string
                  description: validation.max.
                  example: g
                sort:
                  type: string
                  description: ''
                  example: null
                sw_lat:
                  type: number
                  description: 'This field is required when <code>sw_lng</code>, <code>ne_lat</code>, or <code>ne_lng</code> is present. validation.between.'
                  example: -89
                sw_lng:
                  type: number
                  description: 'This field is required when <code>sw_lat</code>, <code>ne_lat</code>, or <code>ne_lng</code> is present. validation.between.'
                  example: -180
                ne_lat:
                  type: number
                  description: 'This field is required when <code>sw_lat</code>, <code>sw_lng</code>, or <code>ne_lng</code> is present. validation.between.'
                  example: -90
                ne_lng:
                  type: number
                  description: 'This field is required when <code>sw_lat</code>, <code>sw_lng</code>, or <code>ne_lat</code> is present. validation.between.'
                  example: -180
                per_page:
                  type: integer
                  description: 'validation.min validation.max.'
                  example: 1
    post:
      summary: 'POST /api/v1/listings'
      operationId: pOSTapiv1listings
      description: 'Create a new listing. Enforces post-limit guard before creation.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                type:
                  type: string
                  description: ''
                  example: mess
                  enum:
                    - rent
                    - sale
                    - hotel
                    - mess
                    - land
                title:
                  type: string
                  description: 'validation.min validation.max.'
                  example: 'n'
                description:
                  type: string
                  description: validation.max.
                  example: 'Animi quos velit et fugiat.'
                  nullable: true
                language_tag:
                  type: string
                  description: validation.max.
                  example: dljnik
                price:
                  type: number
                  description: validation.min.
                  example: 7
                service_charge:
                  type: number
                  description: validation.min.
                  example: 87
                  nullable: true
                advance_months:
                  type: integer
                  description: 'validation.min validation.max.'
                  example: 13
                  nullable: true
                bedrooms:
                  type: integer
                  description: validation.min.
                  example: 50
                  nullable: true
                bathrooms:
                  type: integer
                  description: validation.min.
                  example: 62
                  nullable: true
                floor:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                total_floors:
                  type: integer
                  description: validation.min.
                  example: 22
                  nullable: true
                area_sqft:
                  type: number
                  description: validation.min.
                  example: 84
                  nullable: true
                parking:
                  type: boolean
                  description: ''
                  example: false
                furnished:
                  type: boolean
                  description: ''
                  example: false
                allowed_for:
                  type: string
                  description: ''
                  example: bachelor
                  enum:
                    - bachelor
                    - family
                    - both
                  nullable: true
                utility_flags:
                  type: array
                  description: validation.max.
                  example:
                    - z
                  items:
                    type: string
                address:
                  type: string
                  description: validation.max.
                  example: m
                  nullable: true
                lat:
                  type: number
                  description: validation.between.
                  example: -90
                  nullable: true
                lng:
                  type: number
                  description: validation.between.
                  example: -180
                  nullable: true
                custom_fields:
                  type: array
                  description: ''
                  example: null
                  items:
                    type: string
                    nullable: true
              required:
                - zone_id
                - type
                - title
                - price
  '/api/v1/listings/{id}/distance':
    get:
      summary: 'GET /api/v1/listings/{listing}/distance'
      operationId: gETapiv1listingslistingdistance
      description: 'Straight-line (Haversine) distance from the listing to a user-supplied coordinate.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                  description: validation.between.
                  example: -89
                lng:
                  type: number
                  description: validation.between.
                  example: -179
              required:
                - lat
                - lng
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the listing.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/listings/{id}/share':
    get:
      summary: 'GET /api/v1/listings/{id}/share'
      operationId: gETapiv1listingsidshare
      description: "Returns a shareable deep link, web URL, WhatsApp-ready text, and\nOpenGraph meta for the given active listing."
      parameters: []
      responses: {  }
      tags:
        - General
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the listing.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/listings/{listing_id}/availability':
    get:
      summary: 'GET /api/v1/listings/{listing}/availability?from=Y-m-d&to=Y-m-d'
      operationId: gETapiv1listingslistingavailabilityfromYMDtoYMD
      description: "Public endpoint. Returns per-date availability and pricing for hotel listings.\nWindow is capped at 365 days to prevent large result sets."
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'validation.date Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-07-14'
                to:
                  type: string
                  description: 'validation.date Must be a valid date in the format <code>Y-m-d</code>. validation.after.'
                  example: '2052-08-06'
              required:
                - from
                - to
    put:
      summary: 'PUT /api/v1/listings/{listing}/availability'
      operationId: pUTapiv1listingslistingavailability
      description: "Owner-only. Block/unblock dates and set per-date price overrides.\n\nBody:\n  from           Y-m-d (inclusive)\n  to             Y-m-d (exclusive — same convention as bookings)\n  is_available   bool  (optional)\n  override_price int   (optional, null to clear)"
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'validation.date Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-07-14'
                to:
                  type: string
                  description: 'validation.date Must be a valid date in the format <code>Y-m-d</code>. validation.after.'
                  example: '2052-08-06'
                is_available:
                  type: boolean
                  description: ''
                  example: true
                override_price:
                  type: integer
                  description: validation.min.
                  example: 39
                  nullable: true
              required:
                - from
                - to
    parameters:
      -
        in: path
        name: listing_id
        description: 'The ID of the listing.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/listings/{listing_id}/suggested-technicians':
    get:
      summary: 'GET /api/v1/listings/{listing}/suggested-technicians'
      operationId: gETapiv1listingslistingsuggestedTechnicians
      description: 'Suggest technicians for a listing based on its zone.'
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
    parameters:
      -
        in: path
        name: listing_id
        description: 'The ID of the listing.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/listings/{id}':
    get:
      summary: 'GET /api/v1/listings/{listing}'
      operationId: gETapiv1listingslisting
      description: 'Full listing detail. Active listings are public; owner can view any status.'
      parameters: []
      responses: {  }
      tags:
        - General
    put:
      summary: 'PUT /api/v1/listings/{listing}'
      operationId: pUTapiv1listingslisting
      description: ''
      parameters: []
      responses: {  }
      tags:
        - General
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                type:
                  type: string
                  description: ''
                  example: land
                  enum:
                    - rent
                    - sale
                    - hotel
                    - mess
                    - land
                title:
                  type: string
                  description: 'validation.min validation.max.'
                  example: 'n'
                description:
                  type: string
                  description: validation.max.
                  example: 'Animi quos velit et fugiat.'
                  nullable: true
                language_tag:
                  type: string
                  description: validation.max.
                  example: dljnik
                price:
                  type: number
                  description: validation.min.
                  example: 7
                service_charge:
                  type: number
                  description: validation.min.
                  example: 87
                  nullable: true
                advance_months:
                  type: integer
                  description: 'validation.min validation.max.'
                  example: 13
                  nullable: true
                bedrooms:
                  type: integer
                  description: validation.min.
                  example: 50
                  nullable: true
                bathrooms:
                  type: integer
